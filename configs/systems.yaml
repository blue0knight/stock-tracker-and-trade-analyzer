# Systems configuration for Phase 2 implementation
systems:
# Systems configuration for Phase 2 implementation
systems:
  enabled:
    - system1  # Enable/disable system1
    - system2  # Enable/disable system2

  system1:
    name: "System1"
    enabled: true
    # System1 (Explosive Alerts) configuration
    premarket_window_mins: 30
    lookback_minutes: 5
    volume_multiplier_threshold: 3.0
    price_change_pct_threshold: 1.5
    min_avg_volume: 1000
    alert_window_mins: 5
    alert_action: "log"

  system2:
    name: "System2"
    enabled: true
    # System2 (Pick Generator) configuration
    max_picks: 5
    min_price: 1.0
    min_intraday_volume: 1000
    min_rvol: 0.5
    min_score: 0.0
    priority_alerts_only: false
    pick_action: "log"